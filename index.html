<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Please Forgive Me ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card" id="mainCard">
    <div class="heart">❤️</div>

    <h1>Please forgive me, Yana</h1>

    <p class="message">
      I won't hurt you again.<br>
      I'm truly sorry.
    </p>

    <h2>Will you forgive me? 🥺</h2>

    <div class="buttons">
      <button id="yesBtn">Yes ❤️</button>
      <button id="noBtn">No 😜</button>
    </div>
  </div>

  <div class="card hidden" id="successCard">
    <div class="celebrate">💐</div>

    <h1>Thank you, Yana! ❤️</h1>

    <p class="message">
      I promise I'll try my best<br>
      to never hurt you again.
    </p>

    <div class="gifts">
      <div class="gift">
        <div class="bouquet">💐🌹🌷🌹💐</div>
        <h2>A Rose Bouquet</h2>
        <p>Just for you 🌹</p>
      </div>

      <div class="gift">
        <div class="chocolate">🍫🍫</div>
        <h2>A Chocolate Box</h2>
        <p>Because you deserve something sweet 🤎</p>
      </div>
    </div>

    <p class="final">With love, always ❤️</p>
  </div>

  <div id="hearts"></div>

  <script src="script.js"></script>
</body>
</html>
